<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Set the theme before first paint: saved choice, then system preference, then dark. -->
		<script>
			(function () {
				var t = null;
				try {
					t = localStorage.getItem('theme');
				} catch (e) {}
				if (t !== 'light' && t !== 'dark') {
					t =
						window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches
							? 'light'
							: 'dark';
				}
				document.documentElement.setAttribute('data-theme', t);
				// Scripts run: lets global.css hide what motion-components will animate in.
				document.documentElement.classList.add('js');
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
